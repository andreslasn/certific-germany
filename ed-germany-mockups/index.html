<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ED Germany — Certific Materials</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/certific-germany/favicon.ico" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #3D15E0;
      --primary-hover: #3312BD;
      --black: #222222;
      --black-60: #7A7A7A;
      --lake-20: #F3F6F7;
      --turq: #91E6D5;
      --violet: #AB5CFA;
    }
    body {
      font-family: 'Public Sans', system-ui, sans-serif;
      background: var(--lake-20);
      color: var(--black);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }
    .container {
      max-width: 640px;
      width: 100%;
    }
    .logo {
      width: 140px;
      margin-bottom: 2rem;
    }
    h1 {
      font-family: 'Inter', sans-serif;
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    .subtitle {
      color: var(--black-60);
      font-size: 1.1rem;
      margin-bottom: 2.5rem;
    }
    .cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 1.5rem 2rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(61,21,224,0.12);
    }
    .card-icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      flex-shrink: 0;
    }
    .card-icon.slides { background: linear-gradient(135deg, var(--primary), var(--violet)); color: #fff; }
    .card-icon.patient { background: linear-gradient(135deg, var(--turq), #6DD5C7); color: var(--black); }
    .card-icon.provider { background: linear-gradient(135deg, var(--violet), #D4A5FC); color: #fff; }
    .card-content h2 {
      font-family: 'Inter', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }
    .card-content p {
      color: var(--black-60);
      font-size: 0.95rem;
    }
    .arrow {
      margin-left: auto;
      color: var(--primary);
      font-size: 1.25rem;
    }
    footer {
      margin-top: 3rem;
      color: var(--black-60);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <script src="/slides/ed-germany-mockups/nav-menu.js"></script>
  <div class="container">
    <svg class="logo" viewBox="0 0 512 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M60 0C26.863 0 0 26.863 0 60s26.863 60 60 60 60-26.863 60-60S93.137 0 60 0zm0 96c-19.882 0-36-16.118-36-36s16.118-36 36-36 36 16.118 36 36-16.118 36-36 36z" fill="#222"/>
      <path d="M168.5 85.5c-17.4 0-30-13.2-30-30s12.6-30 30-30c10.8 0 19.2 5.1 24 12.6l-10.8 6.3c-2.7-4.5-7.5-7.2-13.2-7.2-10.2 0-17.4 7.8-17.4 18.3s7.2 18.3 17.4 18.3c5.7 0 10.5-2.7 13.2-7.2l10.8 6.3c-4.8 7.5-13.2 12.6-24 12.6zm68.7-1.5h-13.5l-6-13.5h-24l-6 13.5h-13.5l24-58.5h15l24 58.5zm-25.5-24l-6-13.5-6 13.5h12zm47.7 24h-12V27h12v58zm49.5 0h-12V74.7h-21V84h-12V27h12v36h21V27h12v57zm32.1 0h-12V27h12v57zm30 0h-12V27h33v11.7h-21v13.8h18V64h-18v20zm40.5 0h-12V27h12v57zm41.7 1.5c-17.4 0-30-13.2-30-30s12.6-30 30-30c10.8 0 19.2 5.1 24 12.6l-10.8 6.3c-2.7-4.5-7.5-7.2-13.2-7.2-10.2 0-17.4 7.8-17.4 18.3s7.2 18.3 17.4 18.3c5.7 0 10.5-2.7 13.2-7.2l10.8 6.3c-4.8 7.5-13.2 12.6-24 12.6z" fill="#222"/>
    </svg>

    <h1>ED Germany</h1>
    <p class="subtitle">Materials for emergency department partners</p>

    <div class="cards">
      <a href="/slides/ed-germany/" class="card">
        <div class="card-icon slides">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="m8 21 4-4 4 4"/><path d="M12 17v-4"/></svg>
        </div>
        <div class="card-content">
          <h2>Slide Deck</h2>
          <p>Company overview and product presentation</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>

      <a href="/slides/ed-germany-mockups/patient-flow.html" class="card">
        <div class="card-icon patient">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></svg>
        </div>
        <div class="card-content">
          <h2>Patient Flow</h2>
          <p>Mobile intake experience mockup</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>

      <a href="/slides/ed-germany-mockups/provider-view.html" class="card">
        <div class="card-icon provider">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></svg>
        </div>
        <div class="card-content">
          <h2>Provider View</h2>
          <p>Desktop dashboard for clinicians</p>
        </div>
        <span class="arrow">&rarr;</span>
      </a>
    </div>

    <footer>Certific &middot; Internal use only</footer>
  </div>
</body>
</html>
